<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Histórico - Fiestas</title>
    
    <!-- Reproductor de vídeo moderno (Video.js) -->
    <link href="https://zencdn.net" rel="stylesheet" />
    
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; text-align: center; padding: 20px; margin: 0; }
        .contenedor { max-width: 800px; margin: 0 auto; padding: 10px; }
        
        /* Contenedor del reproductor */
        .video-dimensiones { width: 100%; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: #000; margin-bottom: 25px; }
        
        /* Cuadrícula de botones de años */
        .grid-anios { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin-top: 20px; }
        
        /* Estilo de los botones */
        .btn-anio { background-color: #222; color: #fff; border: 1px solid #444; padding: 12px 5px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; }
        .btn-anio:hover { background-color: #ff9900; border-color: #ff9900; color: #000; }
        .btn-anio.activo { background-color: #ff9900; border-color: #ff9900; color: #000; box-shadow: 0 0 10px rgba(255,153,0,0.5); }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Histórico de Vídeos</h2>
        
        <!-- El Reproductor de Vídeo único -->
        <div class="video-dimensiones">
            <video id="reproductor-fiestas" class="video-js vjs-default-skin vjs-big-play-centered vjs-16-9" controls preload="auto">
                <p class="vjs-no-js">Para ver este vídeo, por favor habilita JavaScript.</p>
            </video>
        </div>

        <p>Selecciona un año para reproducir:</p>
        
        <!-- Botones compactos (Pon aquí tus 42 años) -->
        <div class="grid-anios">
            <button class="btn-anio" onclick="cambiarVideo('TU_ENLACE_BUNNY_1.m3u8', this)">2026</button>
            <button class="btn-anio" onclick="cambiarVideo('https://player.mediadelivery.net/play/752516/b959e64f-3bbb-4d17-9ac2-4c13c720936e', this)">2025</button>
            <button class="btn-anio" onclick="cambiarVideo('https://player.mediadelivery.net/play/752516/b2c76335-d5ed-44e6-aa45-189cf84a1eca', this)">2024</button>
            <button class="btn-anio" onclick="cambiarVideo('https://player.mediadelivery.net/play/752516/ea03e0b2-1436-4f58-bc69-c6653f47c5d1', this)">2023</button>
            <!-- Sigue duplicando esta línea hacia abajo para el resto de años -->
        </div>
    </div>

    <!-- Scripts del reproductor -->
    <script src="https://zencdn.net"></script>

    <script>
        // Inicializamos el reproductor
        var player = videojs('reproductor-fiestas');

        function cambiarVideo(urlVideo, botonPresionado) {
            // 1. Cambiar el vídeo en el reproductor
            player.src({
                src: urlVideo,
                type: 'application/x-mpegURL'
            });
            player.play();

            // 2. Estética: Quitar la marca de "activo" de todos los botones y ponérsela al pulsado
            var botones = document.querySelectorAll('.btn-anio');
            botones.forEach(btn => btn.classList.remove('activo'));
            botonPresionado.classList.add('activo');
        }
    </script>
</body>
</html>
