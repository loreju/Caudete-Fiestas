<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caudete Fiestas</title>
    
    <!-- Metaetiquetas para optimizar el comportamiento en iPhone y Android -->
    <meta name="theme-color" content="#141414">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Caudete Fiestas">
    <link rel="apple-touch-icon" href="img/logo-ctv.png">
    <link rel="manifest" href="manifest.json">

    <!-- Cargamos Hls.js oficial completo desde CDN -->
    <script src="https://jsdelivr.net"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #141414;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            max-width: 1350px;
            margin: 0 auto 30px auto;
            background-color: #1e1e1e;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        /* Bloques de logotipos institucionales con sus textos integrados */
        .header-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 180px;
        }
        .header-block span {
            font-size: 0.85rem;
            color: #cccccc;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            max-width: 180px;
            line-height: 1.2;
        }
        
        /* LOGOS SUPERIORES */
        .logo-ctv-arriba {
            height: 120px; 
            width: auto;
            object-fit: contain;
        }
        .logo-ayuntamiento-arriba {
            width: 170px;
            height: auto;
            object-fit: contain;
        }
        .logo-mayordomia-arriba {
            width: 160px; 
            height: auto;
            object-fit: contain;
        }
        
        /* TÍTULO PRINCIPAL CENTRAL REESTRUCTURADO */
        .title-block {
            flex: 1;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        h1 {
            color: #ffcc00;
            font-size: 2.2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.2;
        }
        .subtitle-years {
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-top: 5px;
            background: rgba(255, 204, 0, 0.1);
            padding: 4px 12px;
            border-radius: 6px;
            display: inline-block;
            margin: 5px auto 0 auto;
        }

        .video-container {
            max-width: 900px;
            margin: 0 auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            padding: 5px;
        }
        video {
            width: 100%;
            display: block;
            border-radius: 8px;
            background-color: #000;
        }

        .comparsas-seccion {
            margin-top: 45px;
        }
        .comparsas-seccion h2 {
            color: #ffcc00;
            font-size: 1.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }
        .comparsas-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* LOGOS INFERIORES EQUILIBRADOS */
        .referencia-grande {
            height: 155px;  
            width: 155px;   
            object-fit: contain;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.6));
            transition: transform 0.2s ease-in-out;
        }
        .ajuste-pequeno {
            height: 120px;  
            width: 120px;   
            object-fit: contain;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.6));
            transition: transform 0.2s ease-in-out;
        }
        
        .referencia-grande:hover, .ajuste-pequeno:hover {
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            .header-container { gap: 20px; padding: 15px; }
            .title-block { order: -1; width: 100%; min-width: 100%; }
            h1 { font-size: 1.6rem; }
            .subtitle-years { font-size: 1rem; }
            .logo-ctv-arriba { height: 80px; }
            .logo-ayuntamiento-arriba { width: 110px; }
            .logo-mayordomia-arriba { width: 105px; }
            .header-block span { font-size: 0.75rem; max-width: 140px; }
            .referencia-grande { width: 105px; height: 105px; }
            .ajuste-pequeno { width: 80px; height: 80px; }
        }
    </style>
</head>
<body>

    <!-- Cabecera organizada con simetría visual y textos institucionales integrados -->
    <div class="header-container">
        <!-- Bloque Izquierdo: CTV -->
        <div class="header-block">
            <img class="logo-ctv-arriba" src="img/logo-ctv.png" alt="Logo CTV">
        </div>
        
        <!-- Bloque Central: Título y Años Históricos -->
        <div class="title-block">
            <h1>Caudete Fiestas de Moros y Cristianos</h1>
            <div class="subtitle-years">1974 Y 1983 A 2025</div>
        </div>
        
        <!-- Bloque Derecho Ayuntamiento: Escudo + Texto sobre/lado -->
        <div class="header-block">
            <span>M.I. Ayuntamiento de Caudete</span>
            <img class="logo-ayuntamiento-arriba" src="img/escudo-ayuntamiento.png" alt="M.I. Ayuntamiento de Caudete">
        </div>
        
        <!-- Bloque Derecho Mayordomía: Escudo + Dedicatoria -->
        <div class="header-block">
            <span>En Honor a Ntra. Sra. de Gracia</span>
            <img class="logo-mayordomia-arriba" src="img/logo-mayordomia.png" alt="M.I. Mayordomía Ntra. Sra. de Gracia">
        </div>
    </div>

    <!-- Reproductor nativo optimizado con la NUEVA URL DE STREAMING CORREGIDA -->
    <div class="video-container">
        <video id="player" controls playsinline autoplay muted preload="auto"></video>
    </div>

    <!-- Sección de Comparsas Tradicionales -->
    <div class="comparsas-seccion">
        <h2>Asociación y Comparsas</h2>
        <div class="comparsas-grid">
            <img class="referencia-grande" src="img/logo-asociacion.png" alt="Asociación de Comparsas" title="Asociación de Comparsas Ntra. Sra. de Gracia">
            <img class="referencia-grande" src="img/guerreros.png" alt="Guerreros" title="Comparsa de Guerreros">
            <img class="ajuste-pequeno" src="img/mirenos.png" alt="Mirenos" title="Comparsa de Mirenos">
            <img class="ajuste-pequeno" src="img/tarik.png" alt="Tarik" title="Comparsa de Tarik">
            <img class="ajuste-pequeno" src="img/moros.png" alt="Moros" title="Comparsa de Moros">
            <img class="ajuste-pequeno" src="img/antigua.png" alt="La Antigua" title="Comparsa de La Antigua">
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('player');
            // NUEVA URL: Cambiada a http y con la 'C' mayúscula en /Canal-CTV/
            const source = 'http://caudetefiestas.duckdns.org/Canal-CTV/index.m3u8';

            // Configuración optimizada del motor HLS
            if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                const hls = new Hls({
                    maxBufferLength: 10,
                    liveSyncDurationCount: 3,
                    xhrSetup: function (xhr, url) {
                        xhr.withCredentials = false;
                    }
                });
                
                hls.loadSource(source);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    console.log("Streaming HLS cargado correctamente.");
                    const playPromise = video.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(error => {
                            console.log("Esperando interacción para audio.");
                        });
                    }
                });

                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                console.log("Fallo de conexión, re-enganchando...");
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                console.log("Fallo de decodificación, restaurando...");
                                hls.recoverMediaError();
                                break;
                            default:
                                console.log("Error crítico del servidor streaming.");
                                break;
                        }
                    }
                });
            } 
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = source;
