<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caudete Fiestas en Vivo</title>
    <!-- Cargamos Video.js original -->
    <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #ffcc00;
        }
        .video-container {
            max-width: 800px;
            margin: 20px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        .instrucciones {
            background-color: #333;
            padding: 15px;
            border-radius: 8px;
            max-width: 600px;
            margin: 20px auto;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Caudete Fiestas - Transmisión en Vivo</h1>
    <p>Disfruta de los videos de las fiestas en ejecución de Canal CTV.</p>

    <div class="video-container">
        <!-- REPRODUCTOR UTILIZANDO UN PROXY DE CORS PARA REPARAR EL ERROR DE MANIFEST -->
        <video
            id="reproductor-caudete"
            class="video-js vjs-default-skin vjs-16-9 vjs-big-play-centered"
            controls
            autoplay
            muted
            preload="auto"
            data-setup='{}'>
            <source src="https://corsproxy.io/?url=http%3A%2F%2F85.49.92.53%2FCanal-CTV%2Findex.m3u8" type="application/x-mpegURL">
            <p class="vjs-no-js">
                Para ver este video, activa JavaScript o usa un navegador que soporte video HTML5.
            </p>
        </video>
    </div>

    <div class="instrucciones">
        <h3>¿El video no inicia automáticamente?</h3>
        <p>Haz clic en el botón de reproducción central. Por normativas de los navegadores modernos, el video iniciará silenciado.</p>
    </div>

    <!-- Scripts de Video.js -->
    <script src="https://vjs.zencdn.net/8.3.0/video.js"></script>
</body>
</html>
