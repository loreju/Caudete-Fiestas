<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caudete Fiestas en Vivo</title>
    <!-- Cargamos el motor Clappr, excelente solucionando problemas de transmisión mixta -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #141414;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #ffcc00;
            margin-bottom: 5px;
        }
        .subtitulo {
            color: #b3b3b3;
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .video-container {
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
        }
        #player {
            width: 100%;
            aspect-ratio: 16/9;
        }
        .instrucciones {
            background-color: #222;
            padding: 15px 20px;
            border-radius: 8px;
            max-width: 600px;
            margin: 30px auto 0 auto;
            font-size: 14px;
            border-left: 4px solid #ffcc00;
            text-align: left;
        }
        .instrucciones h3 {
            margin-top: 0;
            color: #ffcc00;
        }
        .instrucciones p {
            margin-bottom: 0;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>Caudete Fiestas - Transmisión en Vivo</h1>
    <p class="subtitulo">Visualizando la señal en directo de Canal CTV</p>

    <div class="video-container">
        <!-- Contenedor donde Clappr renderizará el streaming -->
        <div id="player"></div>
    </div>

    <div class="instrucciones">
        <h3>¿Problemas con la reproducción?</h3>
        <p>Los navegadores modernos aplican medidas estrictas con transmisiones externas. Si la pantalla se mantiene oscura, pulsa el botón de reproducción integrado o recarga el sitio web.</p>
    </div>

    <script>
        // Dirección de Canal CTV procesada a través del puente AllOrigins para saltar bloqueos de red
        var streamingUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('http://85.49.92.53/Canal-CTV/index.m3u8');

        var player = new Clappr.Player({
            source: streamingUrl,
            parentId: "#player",
            width: '100%',
            height: '100%',
            autoPlay: true,
            mute: true,
            mimeType: "application/x-mpegURL",
            playbackNotSupportedMessage: "Cargando retransmisión... Si no inicia automáticamente, por favor refresca la página."
        });
    </script>
</body>
</html>
