<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caudete Fiestas</title>
    <!-- Cargamos Hls.js y los estilos limpios de Plyr para el boton de Play grande -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #141414;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            color: #ffcc00;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .video-container {
            max-width: 900px;
            margin: 0 auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
        }
        video {
            width: 100%;
            display: block;
        }
        /* Personalización del botón Play de Plyr para que sea amarillo de Caudete */
        .plyr--video .plyr__control--overlaid {
            background: rgba(255, 204, 0, 0.9) !important;
            color: #000 !important;
        }
        .plyr__control {
            color: #000;
        }
        .plyr--full-ui input[type=range] {
            color: #ffcc00 !important;
        }
    </style>
</head>
<body>

    <h1>Caudete Fiestas</h1>

    <div class="video-container">
        <!-- Reproductor limpio con volumen activo y botón de reproducción inicial -->
        <video id="player" controls playsinline poster=""></video>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('player');
            const source = 'http://85.49.92.53/Canal-CTV/index.m3u8';
            
            // Configuración del reproductor visual
            const player = new Plyr(video, {
                controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
                tooltips: { controls: true, seek: true }
            });

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(source);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    // Espera la interacción del usuario con el botón Play
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = source;
            }
        });
    </script>
</body>
</html>
