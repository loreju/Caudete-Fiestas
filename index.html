<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caudete Fiestas</title>
    
    <!-- Metaetiquetas para optimizar el comportamiento en iPhone y Android -->
    <meta name="theme-color" content="#141414">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Caudete Fiestas">
    <link rel="apple-touch-icon" href="img/logo-ctv.png">
    <link rel="manifest" href="manifest.json">

    <!-- Cargamos Hls.js oficial completo desde CDN -->
    <script src="https://jsdelivr.net"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #141414;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            max-width: 1350px;
            margin: 0 auto 30px auto;
            background-color: #1e1e1e;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        /* Bloques de logotipos organizados con títulos abajo */
        .header-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 160px;
            gap: 12px;
        }
        
        /* Rótulos dorados simétricos bajo escudos superiores */
        .header-block h3 {
            color: #ffcc00;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
            font-weight: bold;
            max-width: 180px;
            line-height: 1.3;
        }
        
        /* LOGOS SUPERIORES */
        .logo-ctv-arriba {
            height: 120px; 
            width: auto;
            object-fit: contain;
        }
        .logo-ayuntamiento-arriba {
            width: 170px;
            height: auto;
            object-fit: contain;
        }
        .logo-mayordomia-arriba {
            width: 160px; 
            height: auto;
            object-fit: contain;
        }
        
        /* BLOQUE CENTRAL DE TEXTOS UNIFICADOS */
        .title-block {
            flex: 1;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }
        h1 {
            color: #ffcc00;
            font-size: 2.2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.2;
        }
        .honor-text {
            color: #ffcc00;
            font-size: 1.2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 0;
        }
        .subtitle-years {
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            background: rgba(255, 204, 0, 0.15);
            padding: 4px 16px;
            border-radius: 6px;
            display: inline-block;
            margin-top: 4px;
        }

        .video-container {
            max-width: 900px;
            margin: 0 auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            padding: 5px;
        }
        video {
            width: 100%;
            display: block;
            border-radius: 8px;
            background-color: #000;
        }

        /* SECCIÓN INFERIOR COMPARSAS REESTRUCTURADA */
        .comparsas-seccion {
            margin-top: 50px;
        }
        .comparsas-grid {
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Alinea los bloques por arriba */
            flex-wrap: wrap;
            gap: 35px;
            max-width: 1300px;
            margin: 0 auto;
        }
        
        /* Contenedores individuales para cada comparsa */
        .comparsa-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 165px; /* Caja fija para balancear el texto e imagen */
        }
        /* Nombres individuales dorados */
        .comparsa-card p {
            color: #ffcc00;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            margin: 0;
            line-height: 1.3;
        }
        
        /* LOGOS INFERIORES EQUILIBRADOS */
        .referencia-grande {
            height: 155px;  
            width: 155px;   
            object-fit: contain;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.6));
            transition: transform 0.2s ease-in-out;
        }
        .ajuste-pequeno {
            height: 120px;  
            width: 120px;   
            object-fit: contain;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.6));
            transition: transform 0.2s ease-in-out;
        }
        
        .referencia-grande:hover, .ajuste-pequeno:hover {
            transform: scale(1.08);
        }

        @media (max-width: 768px) {
            .header-container { gap: 20px; padding: 15px; }
            .title-block { order: -1; width: 100%; min-width: 100%; }
            h1 { font-size: 1.5rem; }
            .honor-text { font-size: 0.95rem; }
            .subtitle-years { font-size: 0.95rem; }
            .logo-ctv-arriba { height: 80px; }
            .logo-ayuntamiento-arriba { width: 110px; }
            .logo-mayordomia-arriba { width: 105px; }
            .header-block { min-width: 110px; gap: 6px; }
            .header-block h3 { font-size: 0.7rem; }
            
            .comparsas-grid { gap: 20px; }
            .comparsa-card { width: 110px; gap: 8px; }
            .comparsa-card p { font-size: 0.65rem; }
            .referencia-grande { width: 100px; height: 100px; }
            .ajuste-pequeno { width: 75px; height: 75px; }
        }
    </style>
</head>
<body>

    <!-- Cabecera organizada con simetría inferior en logotipos -->
    <div class="header-container">
        <!-- Bloque Izquierdo: CTV -->
        <div class="header-block">
            <img class="logo-ctv-arriba" src="img/logo-ctv.png" alt="Logo CTV">
        </div>
        
        <!-- Bloque Central Totalmente Unificado -->
        <div class="title-block">
            <h1>Caudete Fiestas de Moros y Cristianos</h1>
            <p class="honor-text">En Honor a Ntra. Sra. de Gracia</p>
            <div class="subtitle-years">1974 - 1983 A 2025</div>
        </div>
        
        <!-- Bloque Derecho: Ayuntamiento con texto abajo -->
        <div class="header-block">
            <img class="logo-ayuntamiento-arriba" src="img/escudo-ayuntamiento.png" alt="M.I. Ayuntamiento de Caudete">
            <h3>M.I. Ayuntamiento<br>de Caudete</h3>
        </div>
        
        <!-- Bloque Derecho: Mayordomía con texto abajo -->
        <div class="header-block">
            <img class="logo-mayordomia-arriba" src="img/logo-mayordomia.png" alt="M.I. Mayordomía Ntra. Sra. de Gracia">
            <h3>M.I. Mayordomía<br>Ntra. Sra. de Gracia</h3>
        </div>
    </div>

    <!-- Reproductor nativo con URL de transmisión actualizada -->
    <div class="video-container">
        <video id="player" controls playsinline autoplay muted preload="auto"></video>
    </div>

    <!-- Sección de Comparsas: Módulos individuales con nombres integrados abajo -->
    <div class="comparsas-seccion">
        <div class="comparsas-grid">
            <div class="comparsa-card">
                <img class="referencia-grande" src="img/logo-asociacion.png" alt="Asociación de Comparsas">
                <p>Asociación de Comparsas</p>
            </div>
            <div class="comparsa-card">
                <img class="referencia-grande" src="img/guerreros.png" alt="Guerreros">
                <p>Comparsa de Guerreros</p>
            </div>
            <div class="comparsa-card">
                <img class="ajuste-pequeno" src="img/mirenos.png" alt="Mirenos">
                <p>Comparsa de Mirenos</p>
            </div>
            <div class="comparsa-card">
                <img class="ajuste-pequeno" src="img/tarik.png" alt="Tarik">
                <p>Comparsa de Tarik</p>
            </div>
            <div class="comparsa-card">
                <img class="ajuste-pequeno" src="img/moros.png" alt="Moros">
                <p>Comparsa de Moros</p>
            </div>
            <div class="comparsa-card">
                <img class="ajuste-pequeno" src="img/antigua.png" alt="La Antigua">
                <p>Comparsa de La Antigua</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('player');
            const source = 'http://duckdns.org';

            // Configuración optimizada del motor HLS
            if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                const hls = new Hls({
                    maxBufferLength: 10,
                    liveSyncDurationCount: 3,
                    xhrSetup: function (xhr, url) {
                        xhr.withCredentials = false;
                    }
                });
                
                hls.loadSource(source);
                hls.attachMedia(video);
