<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caudete Fiestas</title>
    
    <!-- Metaetiquetas para optimizar el comportamiento en iPhone y Android -->
    <meta name="theme-color" content="#141414">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Caudete Fiestas">
    <link rel="apple-touch-icon" href="img/logo-ctv.png">
    <link rel="manifest" href="manifest.json">

    <!-- Cargamos Hls.js oficial completo -->
    <script src="https://jsdelivr.net"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #141414;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto 30px auto;
            background-color: #1e1e1e;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .header-logos {
            height: 70px;
            width: auto;
            object-fit: contain;
        }
        h1 {
            color: #ffcc00;
            font-size: 2.3rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex: 1;
            min-width: 250px;
        }

        .video-container {
            max-width: 900px;
            margin: 0 auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            padding: 5px;
        }
        video {
            width: 100%;
            display: block;
            border-radius: 8px;
        }

        .comparsas-seccion {
            margin-top: 40px;
        }
        .comparsas-seccion h2 {
            color: #ffcc00;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        .comparsas-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 25px;
            max-width: 900px;
            margin: 0 auto;
        }
        .escudo-comparsa {
            width: 65px;
            height: auto;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.6));
            transition: transform 0.2s ease-in-out;
        }
        .logo-asociacion-abajo {
            width: 75px; 
            height: auto;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.6));
            transition: transform 0.2s ease-in-out;
        }
        .escudo-comparsa:hover, .logo-asociacion-abajo:hover {
            transform: scale(1.15);
        }

        @media (max-width: 768px) {
            .header-container { gap: 15px; padding: 15px; }
            h1 { font-size: 1.8rem; width: 100%; order: -1; margin-bottom: 10px; }
            .header-logos { height: 50px; }
            .escudo-comparsa { width: 50px; }
            .logo-asociacion-abajo { width: 60px; }
        }
    </style>
</head>
<body>

    <!-- Cabecera organizada: CTV, Título, Ayuntamiento y Mayordomía -->
    <div class="header-container">
        <img class="header-logos" src="img/logo-ctv.png" alt="Logo CTV">
        <h1>Caudete Fiestas</h1>
        <img class="header-logos" src="img/escudo-ayuntamiento.png" alt="M.I. Ayuntamiento de Caudete">
        <img class="header-logos" src="img/logo-mayordomia.png" alt="M.I. Mayordomía Ntra. Sra. de Gracia">
    </div>

    <!-- Reproductor nativo HTML5 (Inmune a bloqueos visuales de librerías) -->
    <div class="video-container">
        <video id="player" controls playsinline></video>
    </div>

    <!-- Sección de Comparsas Tradicionales con la Asociación delante -->
    <div class="comparsas-seccion">
        <h2>Asociación y Comparsas</h2>
        <div class="comparsas-grid">
            <img class="logo-asociacion-abajo" src="img/logo-asociacion.png" alt="Asociación de Comparsas" title="Asociación de Comparsas Ntra. Sra. de Gracia">
            <img class="escudo-comparsa" src="img/guerreros.png" alt="Guerreros" title="Comparsa de Guerreros">
            <img class="escudo-comparsa" src="img/mirenos.png" alt="Mirenos" title="Comparsa de Mirenos">
            <img class="escudo-comparsa" src="img/tarik.png" alt="Tarik" title="Comparsa de Tarik">
            <img class="escudo-comparsa" src="img/moros.png" alt="Moros" title="Comparsa de Moros">
            <img class="escudo-comparsa" src="img/antigua.png" alt="La Antigua" title="Comparsa de La Antigua">
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('player');
            const source = 'https://dns.org';

            // Forzar la inicialización limpia de la transmisión HLS
            if (Hls.isSupported()) {
                const hls = new Hls({
                    xhrSetup: function (xhr, url) {
                        xhr.withCredentials = false; // Evita conflictos con las cookies de GitHub
                    }
                });
                hls.loadSource(source);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    console.log("Streaming cargado correctamente.");
                });
            } 
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = source;
            }

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
            }
        });
    </script>
</body>
</html>
