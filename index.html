<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caudete Fiestas</title>
    
    <!-- Metaetiquetas para optimizar el comportamiento en iPhone y Android -->
    <meta name="theme-color" content="#141414">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Caudete Fiestas">
    <link rel="apple-touch-icon" href="img/logo-ctv.png">
    <link rel="manifest" href="manifest.json">

    <!-- Cargamos Hls.js oficial completo desde CDN -->
    <script src="https://jsdelivr.net"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #141414;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            max-width: 1250px;
            margin: 0 auto 30px auto;
            background-color: #1e1e1e;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        /* LOGOS SUPERIORES */
        .header-logos {
            height: 90px; 
            width: auto;
            object-fit: contain;
        }
        /* CORRECCIÓN: Ayuntamiento un 35% más grande */
        .logo-ayuntamiento-arriba {
            height: 125px;
            width: auto;
            object-fit: contain;
        }
        
        h1 {
            color: #ffcc00;
            font-size: 2.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex: 1;
            min-width: 250px;
        }

        .video-container {
            max-width: 900px;
            margin: 0 auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            padding: 5px;
        }
        video {
            width: 100%;
            display: block;
            border-radius: 8px;
            background-color: #000;
        }

        .comparsas-seccion {
            margin-top: 45px;
        }
        .comparsas-seccion h2 {
            color: #ffcc00;
            font-size: 1.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }
        .comparsas-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 1100px;
            margin: 0 auto;
        }
        
        /* LOGOS DE COMPARSAS GENERALES */
        .escudo-comparsa, .logo-asociacion-abajo {
            height: 95px;  
            width: 95px;   
            object-fit: contain;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.6));
            transition: transform 0.2s ease-in-out;
        }
        
        /* CORRECCIÓN: Asociación y Guerreros destacados con tamaño ampliado */
        .destacado-grande {
            height: 130px;
            width: 130px;
        }
        
        .escudo-comparsa:hover, .logo-asociacion-abajo:hover {
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            .header-container { gap: 15px; padding: 15px; }
            h1 { font-size: 1.8rem; width: 100%; order: -1; margin-bottom: 10px; }
            .header-logos { height: 65px; }
            .logo-ayuntamiento-arriba { height: 90px; }
            .escudo-comparsa, .logo-asociacion-abajo { width: 70px; height: 70px; }
            .destacado-grande { width: 95px; height: 95px; }
        }
    </style>
</head>
<body>

    <!-- Cabecera organizada: Logo CTV Normal, Título, Ayuntamiento (Más Grande) y Mayordomía -->
    <div class="header-container">
        <img class="header-logos" src="img/logo-ctv.png" alt="Logo CTV">
        <h1>Caudete Fiestas</h1>
        <img class="logo-ayuntamiento-arriba" src="img/escudo-ayuntamiento.png" alt="M.I. Ayuntamiento de Caudete">
        <img class="header-logos" src="img/logo-mayordomia.png" alt="M.I. Mayordomía Ntra. Sra. de Gracia">
    </div>

    <!-- Reproductor nativo optimizado para transmisiones en directo -->
    <div class="video-container">
        <video id="player" controls playsinline autoplay muted preload="auto"></video>
    </div>

    <!-- Sección de Comparsas: Asociación y Guerreros ampliados en el grid -->
    <div class="comparsas-seccion">
        <h2>Asociación y Comparsas</h2>
        <div class="comparsas-grid">
            <img class="logo-asociacion-abajo destacado-grande" src="img/logo-asociacion.png" alt="Asociación de Comparsas" title="Asociación de Comparsas Ntra. Sra. de Gracia">
            <img class="escudo-comparsa destacado-grande" src="img/guerreros.png" alt="Guerreros" title="Comparsa de Guerreros">
            <img class="escudo-comparsa" src="img/mirenos.png" alt="Mirenos" title="Comparsa de Mirenos">
            <img class="escudo-comparsa" src="img/tarik.png" alt="Tarik" title="Comparsa de Tarik">
            <img class="escudo-comparsa" src="img/moros.png" alt="Moros" title="Comparsa de Moros">
            <img class="escudo-comparsa" src="img/antigua.png" alt="La Antigua" title="Comparsa de La Antigua">
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('player');
            const source = 'https://duckdns.org';

            // Configuración optimizada del motor HLS
            if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                const hls = new Hls({
                    maxBufferLength: 10,
                    liveSyncDurationCount: 3,
                    xhrSetup: function (xhr, url) {
                        xhr.withCredentials = false;
                    }
                });
                
                hls.loadSource(source);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    console.log("Streaming HLS cargado.");
                    // Intento de reproducción forzada
                    const playPromise = video.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(error => {
                            console.log("Esperando interacción para audio.");
                        });
                    }
                });

                // Auto-recuperación activa frente a caídas del streaming directo
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                console.log("Fallo de conexión, re-enganchando...");
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                console.log("Fallo de decodificación, restaurando...");
                                hls.recoverMediaError();
                                break;
                            default:
                                console.log("Error crítico del servidor streaming.");
                                break;
                        }
                    }
                });
            } 
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Soporte de Safari nativo
                video.src = source;
                video.addEventListener('loadedmetadata', () => {
                    video.play().catch(err => console.log("Safari requirió acción manual."));
                });
            }

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
            }
        });
    </script>
</body>
</html>
